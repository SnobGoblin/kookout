# Cloudflare Worker that relays live wind observations from MET's Frost API to the page.
# The Frost client ID is a secret (FROST_CLIENT_ID), set with: npx wrangler secret put FROST_CLIENT_ID
name = "wingfoil-relay"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false

# Stored NOAA wave forecasts (NOAA's server is slow from Cloudflare, and waves only change every 6 hours)
[[kv_namespaces]]
binding = "WAVES"
id = "dab72f0bb79e44ceb8dad18acb85adf9"

# The phones that want notifications (see schema.sql)
[[d1_databases]]
binding = "DB"
database_name = "kookout"
database_id = "3e391139-da69-443c-8f07-f0bfee64e9f2"

# Every 3 hours: refresh the stored wave forecasts. Every hour: check the spots and send notifications.
[triggers]
crons = ["17 */3 * * *", "7 * * * *"]

# Apple's push service (APNs). The signing key is a secret: npx wrangler secret put APNS_KEY
# (paste the whole .p8 file). The key id and team id aren't secret.
[vars]
APNS_KEY_ID = "WVA3H73V3C"
APNS_TEAM_ID = "5KZ7KF5NNH"
APNS_TOPIC = "com.sternell.kookout"
