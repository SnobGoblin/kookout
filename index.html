  <style>
    :root {
      --bg: #ffffff; --text: #1b2330; --muted: #6b7686; --border: #e6e9ee;
      --accent: #1f6fd1; --chip: #f1f3f6; --rain: #2f86e0; --dayrow: #f6f7f9;
      --good: #12a150; --good-bg: #e3f6ea; --snow: #3b82f6; --snow-bg: #e3edfd;
      --off: #c9d0d9; --danger: #d33;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #11161d; --text: #e6ebf2; --muted: #8b97a8; --border: #232c38;
              --accent: #6aa8ff; --chip: #1c2430; --rain: #5aa5f5; --dayrow: #161d26;
              --good: #3ccf7a; --good-bg: #13301f; --snow: #7fb0ff; --snow-bg: #172640;
              --off: #3a4554; --danger: #ff6b6b; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font: 15px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 12px 16px 40px; }
    button { font: inherit; color: inherit; }

    /* Top bar: a scrollable row of spot buttons, and the settings cog */
    .top { display: flex; align-items: center; gap: 6px; position: sticky; top: 0;
           background: var(--bg); z-index: 2; padding: 4px 0 10px; }
    nav { display: flex; gap: 6px; overflow-x: auto; flex: 1; }
    nav button { flex: 0 0 auto; font-size: .9rem; padding: 6px 12px; border-radius: 999px;
                 border: 1px solid var(--border); background: var(--chip); cursor: pointer; }
    nav button.good { border-color: var(--good); box-shadow: inset 0 0 0 1px var(--good); }
    nav button.snow { border-color: var(--snow); box-shadow: inset 0 0 0 1px var(--snow); }
    nav button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
    nav .badge { font-size: .8rem; margin-left: 4px; }
    nav button.good .badge { color: var(--good); }
    nav button[aria-pressed="true"] .badge { color: inherit; }
    #cog { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border);
           background: var(--chip); cursor: pointer; font-size: 1.15rem; line-height: 1; }
    .ico { height: 1.6em; width: auto; fill: currentColor; vertical-align: -0.45em; }

    /* The wordmark: KOOKOUT with the two O's looking out (brand/kookout-wordmark-navy.svg, drawn by brand/render.swift) */
    .logo { display: block; width: max-content; color: #0E2A3B; padding: 4px 0 8px; }
    .logo svg { display: block; height: 20px; width: auto; }
    @media (prefers-color-scheme: dark) { .logo { color: #ffffff; } }
    h1 { font-size: 1.15rem; margin: 6px 0 2px; }
    .sub { color: var(--muted); font-size: .85rem; margin-bottom: 4px; }
    .sub a { color: var(--accent); }
    .rule { color: var(--muted); font-size: .8rem; margin-bottom: 10px; }
    /* "The app is coming" banner */
    .appnote { display: flex; align-items: center; gap: 10px; margin: 2px 0 10px; padding: 10px 12px; border-radius: 10px;
               background: var(--good-bg); font-size: .85rem; }
    .appnote[hidden] { display: none; }
    .appnote .ico { height: 2.2em; color: var(--good); flex: none; }
    .appnote div { flex: 1; }
    .appnote b { display: block; }
    .appnote small { color: var(--muted); }
    .appnote button { flex: none; border: 0; background: none; color: var(--muted); font-size: 1.2rem; cursor: pointer; padding: 4px 6px; }
    .live { font-size: .9rem; margin: -2px 0 10px; padding: 6px 10px; border-radius: 8px; background: var(--dayrow); }
    .live:empty { display: none; }
    .live .arrow { width: 16px; height: 16px; margin: 0 2px; }
    .live small { color: var(--muted); }
    .live summary { cursor: pointer; }
    .live iframe { display: block; width: 100%; height: 250px; border: 0; border-radius: 8px; margin-top: 8px; }
    .live.good { background: var(--good-bg); box-shadow: inset 4px 0 0 var(--good); }
    .stations button { display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left;
                       background: none; border: 0; border-top: 1px solid var(--border); padding: 8px 0; cursor: pointer; }
    .stations button[aria-pressed="true"] { color: var(--good); font-weight: 500; }
    .stations small { color: var(--muted); white-space: nowrap; }

    /* The hourly list */
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    th { text-align: right; font-weight: 500; color: var(--muted); font-size: .78rem; padding: 4px 6px; }
    th:first-child { text-align: left; }
    th:last-child { text-align: left; padding-left: 10px; }
    td { padding: 4px 6px; border-top: 1px solid var(--border); text-align: right; white-space: nowrap; }
    td:first-child { text-align: left; color: var(--muted); }
    td img { width: 30px; height: 30px; vertical-align: middle; }
    .day td { background: var(--dayrow); color: var(--text); font-weight: 600; text-align: left; padding: 8px 6px; }
    .day .tag { font-weight: 500; font-size: .85rem; margin-left: 8px; }
    .day .tag.good { color: var(--good); }
    .day .tag.snow { color: var(--snow); }
    .day .suntimes { float: right; font-weight: 400; font-size: .8rem; color: var(--muted); }
    tr.good td { background: var(--good-bg); }
    tr.good td:first-child { box-shadow: inset 4px 0 0 var(--good); color: var(--text); }
    tr.snow td { background: var(--snow-bg); }
    tr.snow td:first-child { box-shadow: inset 4px 0 0 var(--snow); color: var(--text); }
    .cold { color: var(--rain); }
    .rain { color: var(--rain); }
    .gust { color: var(--muted); }
    td.dir { text-align: left; padding-left: 10px; }
    td.dir span { display: inline-block; min-width: 2.4em; margin-left: 6px; vertical-align: middle; }
    .arrow { display: inline-block; width: 20px; height: 20px; vertical-align: middle; }
    .note td { color: var(--muted); font-size: .8rem; text-align: center; padding: 10px 6px; border-top: 2px solid var(--border); }
    .error { color: var(--danger); }
    footer { color: var(--muted); font-size: .8rem; margin-top: 16px; }
    footer a { color: var(--accent); }

    /* Settings: a full-screen sheet over the page */
    #settings { position: fixed; inset: 0; z-index: 10; background: var(--bg); overflow-y: auto; }
    #settings[hidden] { display: none; }
    .sheet { max-width: 640px; margin: 0 auto; padding: 12px 16px 40px; }
    .sh { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-bottom: 8px;
          position: sticky; top: 0; background: var(--bg); padding: 6px 0; z-index: 1; }
    .sh h2 { font-size: 1.05rem; margin: 0; text-align: center; }
    .sh > :last-child { justify-self: end; }
    .link { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 6px 0; }
    .sh .link { min-height: 44px; min-width: 64px; padding: 10px 12px; margin: -6px -12px; font-size: 1rem; }
    .sh > :last-child.link { text-align: right; }
    .sh > :first-child.link { text-align: left; justify-self: start; }
    .link.danger, .wide.danger { color: var(--danger); }
    .lbl { color: var(--muted); font-size: .8rem; margin: 16px 0 6px; }
    .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .seg button { border: 0; background: none; padding: 7px 16px; cursor: pointer; }
    .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
    .spots { list-style: none; margin: 0; padding: 0; }
    .spots li { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--border); }
    .move { display: flex; flex-direction: column; }
    .move button { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0 4px; font-size: .7rem; line-height: 1.4; }
    .move button:disabled { opacity: .25; cursor: default; }
    .spot { flex: 1; min-width: 0; text-align: left; background: none; border: 0; cursor: pointer; padding: 4px 0; }
    .spot b { font-weight: 500; display: block; }
    .spot small { color: var(--muted); font-size: .78rem; }
    .wide { display: block; width: 100%; margin-top: 14px; padding: 10px; border-radius: 10px;
            border: 1px solid var(--border); background: var(--chip); cursor: pointer; color: var(--accent); }
    .wide.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .txt { width: 100%; font: inherit; font-size: 16px; padding: 9px 10px; border-radius: 8px;
           border: 1px solid var(--border); background: var(--bg); color: var(--text); }
    .search { display: flex; gap: 6px; }
    .search button { flex: none; padding: 0 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--chip); cursor: pointer; }
    .results button { display: block; width: 100%; text-align: left; background: none; border: 0;
                      border-top: 1px solid var(--border); padding: 8px 0; cursor: pointer; }
    .results small { color: var(--muted); display: block; font-size: .78rem; }
    #map { height: 260px; border-radius: 10px; border: 1px solid var(--border); margin-top: 4px; }
    .compass { display: block; width: 210px; height: 210px; margin: 0 auto; }
    .compass path { cursor: pointer; stroke: var(--bg); stroke-width: 1.5; }
    .compass text { fill: var(--muted); font-size: 11px; }
    .center { text-align: center; }
    .stepper, .switch { display: flex; align-items: center; justify-content: space-between;
                        padding: 8px 0; border-top: 1px solid var(--border); }
    .stepper .num { display: inline-flex; align-items: center; gap: 10px; }
    .stepper .num b { font-weight: 500; min-width: 2ch; text-align: center; font-variant-numeric: tabular-nums; }
    .stepper button { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border);
                      background: var(--chip); cursor: pointer; font-size: 1.1rem; line-height: 1; }
    /* iOS-style on/off switch made from a checkbox */
    .tg { position: relative; flex: none; width: 44px; height: 26px; }
    .tg input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; cursor: pointer; z-index: 1; }
    .tg span { position: absolute; inset: 0; border-radius: 13px; background: var(--off); transition: background .15s; }
    .tg span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
                      border-radius: 50%; background: #fff; transition: transform .15s; }
    .tg input:checked + span { background: var(--good); }
    .tg input:checked + span::after { transform: translateX(18px); }
  </style>
</head>

  <div class="appnote" id="appnote" hidden>
    <svg class="ico" viewBox="71 -4 466 696" aria-hidden="true"><use href="#wing"/></svg>
    <div><b>Kookout-appen kommer snart til iPhone</b>
      <small>Med varsler når det blir bra der du vil være. Nettversjonen har færre funksjoner.</small></div>
    <button id="appnote-close" aria-label="Lukk">×</button>
  </div>
  <h1 id="name"></h1>
  <div class="sub" id="sub"></div>
  <div class="rule" id="rule"></div>
  <div class="live" id="live"></div>
  <div id="list"><p class="sub">Laster…</p></div>
  <footer>Data fra <a href="https://www.yr.no">yr.no</a> / Meteorologisk institutt (CC BY 4.0).
    Stedssøk og kart fra <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>.
    <br><b>Kookout</b> · <a href="mailto:hi@kookout.no">hi@kookout.no</a> · <a href="privacy.html">Privacy</a></footer>
</main>
<div id="settings" hidden><div class="sheet" id="sheet"></div></div>

<script type="module">
// The rules (forecast -> good hours) live in rules.js, shared with the relay, so web, app and notifications agree.
import * as R from "./rules.js";

// ---- 1. Default spots and rules ---------------------------------------------
// These are only the starting point. Changes made under ⚙︎ are saved in this browser.
//
// wind:   good when (mean >= min AND gust >= gust) OR mean >= steady, from one of `dirs`,
//         for `hours` in a row (between sunrise and sunset if `daylight`).
//         sunny: an optional lower {min, gust, steady} for days that are mostly sunny (sea breeze).
// surf:   good when waves are at least minWave m (and the period at least minPeriod s, if set),
//         and the wind is at most maxWind, from one of `dirs`,
//         for `hours` in a row (between sunrise and sunset if `daylight`). Waves are total wave height.
// powder: good when a day has > mm precipitation, stays below maxTemp °C, with wind under maxWind.
// All wind values are stored in m/s; knots are only used for display and editing.
const COMPASS = R.COMPASS;
const SOUTH   = ["SE", "SSE", "S", "SSW", "SW"];
const WEST    = ["SSW", "SW", "WSW", "W", "WNW", "NW", "NNW"];

// The standard wing rule every new spot starts with: 5 (9) or a steady 6+, 2 hours, daylight, any direction.
// The standard surf rule: waves of at least 0.8 m, wind at most 6 m/s, 2 hours, daylight, any wind direction
// (pick the offshore directions on the compass).
const standardSurf = (extra = {}) =>
  ({ minWave: 0.8, minPeriod: 0, maxWind: 6, hours: 2, daylight: true, dirs: [...COMPASS], ...extra });

// The standard powder rule: over 10 mm precipitation in a day, colder than +2°, wind under 8 m/s.
const standardPowder = () => ({ mm: 10, maxTemp: 2, maxWind: 8 });

const standardWind = (extra = {}) =>
  ({ min: 5, gust: 9, steady: 6, hours: 2, daylight: true, dirs: [...COMPASS], sunny: null, ...extra });

const DEFAULT_SPOTS = [
  { id: "drobak",    name: "Torkild",          lat: 59.6732, lon: 10.6161, alt: 0,   yr: "1-2314605",
    wind: standardWind({ dirs: SOUTH, sunny: { min: 4, gust: 8, steady: 5 } }),
    station: { holfuy: 1815, name: "Drøbak Fluid.no" } },
  { id: "brattesto", name: "Brattestø",        lat: 59.0561, lon: 10.9193, alt: 0,   yr: "1-34165",
    wind: standardWind({ dirs: ["S", "SSW", "SW", "WSW", "W"] }), station: { id: "KV:8925059", name: "Vikertangen (Kystverket)" } },
  { id: "larkollen", name: "Larkollen",   lat: 59.3232, lon: 10.6678, alt: 0,   yr: "1-2779456",
    wind: standardWind({ dirs: ["S", "SSW", "SW", "WSW"] }), station: { id: "SN17280", name: "Gullholmen" } },
  { id: "lysaker",   name: "Lysakerfjorden",   lat: 59.9029, lon: 10.6466, alt: 0,   yr: "1-72928",
    wind: standardWind({ dirs: [] }) },
  { id: "orekroken", name: "Ørekroken",        lat: 59.0304, lon: 11.0105, alt: 0,   yr: "1-34234",
    wind: standardWind({ dirs: ["SW"] }), station: { id: "KV:8925059", name: "Vikertangen (Kystverket)" } },
  { id: "hemsedal",  name: "Hemsedal 690 MOH", lat: 60.8598, lon: 8.5189,  alt: 690, yr: "11-63588",
    powder: { mm: 10, maxTemp: 2, maxWind: 8 } },
  { id: "apelviken", name: "Apelviken",        lat: 57.0832, lon: 12.2668, alt: 6,   yr: "2-2725565", tz: "Europe/Stockholm",
    wind: standardWind({ dirs: WEST }) },
  { id: "bore",      name: "Borestranda",      lat: 58.7961, lon: 5.5675,  alt: 6,   yr: "10-1027661",
    wind: standardWind({ dirs: WEST }) },
  { id: "movik",     name: "Møvik",            lat: 59.3331, lon: 10.7185, alt: 0,   yr: "1-2289533",
    wind: standardWind({ dirs: ["SW", "SSW"] }), station: { id: "SN17280", name: "Gullholmen" } },
  { id: "presteskjaer", name: "Presteskjær",   lat: 59.8091, lon: 10.7035, alt: 1,   yr: "1-73291",
    wind: standardWind({ dirs: ["N", "NNE", "NE"] }) },
];

// ---- 2. Saved settings ------------------------------------------------------
const STORE = "wingfoil-settings";
// Feet for wave heights where that's the norm (the US and a few others), metres everywhere else.
function defaultWaveUnit() {
  const lang = (navigator.languages?.[0] ?? navigator.language ?? "").toLowerCase();
  return /^en-(us|lr)$|^my\b/.test(lang) ? "ft" : "m";
}
function loadSettings() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE));
    if (saved && Array.isArray(saved.spots)) return { waveUnit: defaultWaveUnit(), ...saved };
  } catch {}
  return { units: "ms", waveUnit: defaultWaveUnit(), spots: structuredClone(DEFAULT_SPOTS) };
}
let settings = loadSettings();
function save() { try { localStorage.setItem(STORE, JSON.stringify(settings)); } catch {} }

// Units: everything is stored in m/s and converted for display.
const KNOTS = 1.94384;
const unit  = () => settings.units === "kn" ? "kn" : "m/s";
const toUnit   = ms => settings.units === "kn" ? ms * KNOTS : ms;
const fromUnit = v  => settings.units === "kn" ? v / KNOTS : v;
const w = ms => Math.round(toUnit(ms)); // a wind speed as shown on screen

// Wave heights are stored in metres; shown as metres with one decimal, or whole feet.
const FEET = 3.28084;
const waveUnit = () => settings.waveUnit === "ft" ? "ft" : "m";
const wv = m => waveUnit() === "ft" ? Math.round(m * FEET) : Math.round(m * 10) / 10; // as shown on screen
const wvText = m => waveUnit() === "ft" ? String(wv(m)) : wv(m).toFixed(1);

// "API" for the page: MET's forecast. "complete" (instead of "compact") also gives us wind gusts.
const API = "https://api.met.no/weatherapi/locationforecast/2.0/complete";
const icon = code => `https://cdn.jsdelivr.net/gh/metno/weathericons@main/weather/svg/${code}.svg`;

// ---- 3. Fetch (cached in memory, so switching back and forth is instant) ----
const cache = {};
function getForecast(p) {
  const key = `${p.lat},${p.lon},${p.alt ?? ""}`;
  if (!cache[key]) {
    const url = `${API}?lat=${p.lat}&lon=${p.lon}` + (p.alt != null ? `&altitude=${p.alt}` : "");
    cache[key] = fetch(url).then(res => {
      if (!res.ok) throw new Error(`MET svarte ${res.status}`);
      return res.json();
    });
    cache[key].catch(() => delete cache[key]); // allow retry after an error
  }
  return cache[key];
}

// Wave forecasts (surf spots only) come through our relay: MET in Scandinavia, NOAA elsewhere.
const waveCache = {};
function getWaves(p) {
  if (!p.surf) return Promise.resolve(null);
  const key = `${p.lat},${p.lon}`;
  const giveUp = new Promise(done => setTimeout(() => done(null), 25000)); // no waves after 25 s: show the rest anyway
  return waveCache[key] ??= Promise.race([relay(`/waves?lat=${p.lat}&lon=${p.lon}`).catch(() => null), giveUp])
    .then(waves => { if (!waves?.points?.length) delete waveCache[key]; return waves; }); // try again next time
}

// ---- 4. Time zones, and working out a spot -------------------------------------
const compass = R.compass;
// All times are shown in the spot's own time zone (e.g. Waikiki in Hawaiian time), not the viewer's.
// `zone` is set to the spot's zone before a spot is worked out and drawn; undefined = the viewer's own zone.
let zone;
const fmtCache = {};
const timeFmt = (locale, opts) => fmtCache[zone + locale + JSON.stringify(opts)] ??=
  new Intl.DateTimeFormat(locale, { ...opts, timeZone: zone });
const dayKey  = d => timeFmt("en-CA", { year: "numeric", month: "2-digit", day: "2-digit" }).format(d); // YYYY-MM-DD
const hourOf  = d => Number(timeFmt("en-GB", { hour: "numeric", hourCycle: "h23" }).format(d));       // 0–23

// Work out a spot: the shared rules from rules.js, with this page's units, in the spot's own time zone.
function analyse(p, data, waves) {
  zone = p.tz; // also used by the time formatting below
  return R.analyse(p, data, waves, { units: settings.units, waveUnit: settings.waveUnit, zone: p.tz });
}

// ---- 5. Render the forecast -----------------------------------------------------
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const dayFmt  = { format: d => timeFmt("nb-NO", { weekday: "long", day: "numeric", month: "long" }).format(d) };
const hourFmt = { format: d => timeFmt("nb-NO", { hour: "2-digit", minute: "2-digit" }).format(d) };
const hhFmt   = { format: d => timeFmt("nb-NO", { hour: "2-digit" }).format(d) };
const wdFmt   = { format: d => timeFmt("nb-NO", { weekday: "short" }).format(d) };

// Wind direction is where the wind comes FROM, so the arrow points the opposite way
// (same convention as yr: an arrow pointing down means wind from the north).
const arrow = deg => `<svg class="arrow" viewBox="0 0 20 20" style="transform:rotate(${deg + 180}deg)">
  <path d="M10 1 L17 10 H12.5 V19 H7.5 V10 H3 Z" fill="currentColor"/></svg>`;

// The wing foiler icon takes the colour of the text around it.
const WING = `<svg class="ico" viewBox="71 -4 466 696" aria-label="Bra vind"><use href="#wing"/></svg>`;
const SURF = "🏄";
const sportIcon = p => p.surf ? SURF : WING;

const endOf = r => new Date(r.time.getTime() + r.hours * 3600e3);

// Directions as short ranges on the compass, e.g. ["S","SSW","SW"] -> "S–SW".
function dirSummary(dirs) {
  if (dirs.length === 16) return "alle retninger";
  if (!dirs.length) return "ingen retninger";
  const on = COMPASS.map(d => dirs.includes(d));
  const runs = [];
  for (let i = 0; i < 16; i++) {
    if (!on[i] || on[(i + 15) % 16]) continue; // start of a run
    let j = i;
    while (on[(j + 1) % 16]) j++;
    runs.push(j === i ? COMPASS[i] : `${COMPASS[i]}–${COMPASS[j % 16]}`);
  }
  return runs.join(", ");
}

const limits = l => `${w(l.min)} (${w(l.gust)}) eller ${w(l.steady)}+`;

function ruleText(p) {
  if (p.wind) {
    const r = p.wind;
    if (!r.dirs.length) return `${WING} Velg retninger under ⚙︎ for å få varsel om bra vind.`;
    return `${WING} Bra vind: ${limits(r)} ${unit()} fra ${dirSummary(r.dirs)}, ` +
      `minst ${r.hours} ${r.hours === 1 ? "time" : "timer"} på rad${r.daylight ? " i dagslys" : ""}` +
      (r.sunny ? `. På dager med mest sol holder ${limits(r.sunny)}` : "") + ".";
  }
  if (p.surf) {
    const r = p.surf;
    if (!r.dirs.length) return `${SURF} Velg vindretninger under ⚙︎ for å få varsel om bra surf.`;
    return `${SURF} Bra surf: bølger minst ${wvText(r.minWave)} ${waveUnit()}${r.minPeriod ? ` og ${r.minPeriod} s periode` : ""}, ` +
      `vind høyst ${w(r.maxWind)} ${unit()} fra ${dirSummary(r.dirs)}, ` +
      `minst ${r.hours} ${r.hours === 1 ? "time" : "timer"} på rad${r.daylight ? " i dagslys" : ""}.`;
  }
  if (p.powder) {
    const s = p.powder;
    return `❄️ Pudder: over ${s.mm} mm nedbør på en dag, kaldere enn +${s.maxTemp}° og vind under ${w(s.maxWind)} ${unit()}.`;
  }
  return "";
}

function dayTag(dayRows, p) {
  const good = dayRows.filter(r => r.good);
  if (good.length) {
    return `<span class="tag good">${sportIcon(p)} Bra ${p.surf ? "surf" : "vind"} ${hhFmt.format(good[0].time)}–${hhFmt.format(endOf(good.at(-1)))}</span>`;
  }
  if (dayRows[0].powderDay) {
    return `<span class="tag snow">❄️ Pudder (${dayRows[0].powderDay.toFixed(0)} mm)</span>`;
  }
  return "";
}

function render(p, data, waves) {
  const rows = analyse(p, data, waves);
  let html = "";
  let note = false;

  const byDay = new Map();
  for (const r of rows) byDay.set(r.day, [...(byDay.get(r.day) ?? []), r]);
  for (const dayRows of byDay.values()) {
    const name = dayFmt.format(dayRows[0].time);
    const s = dayRows[0].sun;
    const sunText = s ? `<span class="suntimes">☀︎ ${hourFmt.format(s.rise)}–${hourFmt.format(s.set)}</span>` : "";
    html += `<tr class="day"><td colspan="6">${name[0].toUpperCase() + name.slice(1)}${dayTag(dayRows, p)}${sunText}</td></tr>`;
    for (const r of dayRows) {
      if (r.hours === 6 && !note) {
        html += `<tr class="note"><td colspan="6">Videre: 6-timers varsel</td></tr>`;
        note = true;
      }
      const temp = Math.round(r.temp);
      const label = r.hours === 1 ? hourFmt.format(r.time)
                                  : `${hhFmt.format(r.time)}–${hhFmt.format(endOf(r))}`;
      html += `<tr class="${r.good ? "good" : r.snow ? "snow" : ""}">
        <td>${label}</td>
        <td><img src="${icon(r.symbol)}" alt="${r.symbol}"></td>
        <td class="${temp <= 0 ? "cold" : ""}">${temp}°</td>
        <td class="rain">${p.surf ? (r.wave != null ? wvText(r.wave) + (r.period ? ` <span class="gust">${Math.round(r.period)}s</span>` : "") : "–")
                                  : r.rain > 0 ? r.rain.toFixed(1) : ""}</td>
        <td>${w(r.wind)} <span class="gust">(${r.gust === null ? "–" : w(r.gust)})</span></td>
        <td class="dir">${arrow(r.deg)}<span>${r.dir}</span></td>
      </tr>`;
    }
  }

  $("list").innerHTML = `<table>
    <thead><tr><th>Tid</th><th></th><th>Temp</th><th>${p.surf ? `Bølger ${waveUnit()}` : "mm"}</th><th>Vind ${unit()}</th><th>Fra</th></tr></thead>
    <tbody>${html}</tbody></table>`;

  const updated = hourFmt.format(new Date(data.properties.meta.updated_at));
  const myZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
  const localNote = p.tz && p.tz !== myZone && timeFmt("nb-NO", { hour: "2-digit" }).format(new Date()) !==
    new Intl.DateTimeFormat("nb-NO", { hour: "2-digit" }).format(new Date())
    ? `Lokal tid (${p.tz.split("/").pop().replace(/_/g, " ")}, ${timeFmt("en-GB", { timeZoneName: "short" }).format(new Date()).split(" ").pop()}) · ` : "";
  $("sub").innerHTML = `${localNote}${p.alt > 50 ? p.alt + " moh · " : ""}Oppdatert ${updated}` +
    (p.yr ? ` · <a href="https://www.yr.no/nb/v%C3%A6rvarsel/timetabell/${p.yr}/" target="_blank">Åpne på yr</a>` : "");
  $("rule").innerHTML = ruleText(p) +
    (p.surf && waves?.source === "NOAA" ? ` <small>Bølger fra NOAA (globalt, grovt rutenett: ${waves.km} km ut).</small>` : "") +
    (p.surf && waves === undefined ? ` <small>Henter bølgevarsel…</small>` : "") +
    (p.surf && waves !== undefined && !waves?.points?.length ? ` <small>Fant ikke bølgevarsel for denne spotten.</small>` : "");
}

// ---- 6. Spot buttons, with a badge when something good is coming ------------
const visibleSpots = () => settings.spots.filter(s => !s.hidden);

function badge(p, data, waves) {
  const btn = $("places").querySelector(`[data-id="${p.id}"]`);
  if (!btn) return;
  const first = analyse(p, data, waves).find(r => r.good || r.powderDay);
  btn.classList.toggle("good", !!first?.good);
  btn.classList.toggle("snow", !!first && !first.good);
  const when = first && (first.day === dayKey(new Date()) ? "i dag" : wdFmt.format(first.time).replace(".", ""));
  btn.querySelector(".badge").innerHTML = first ? `${first.good ? sportIcon(p) : "❄️"} ${when}` : "";
}

// A spot's time zone is looked up once (through the relay) and saved with the spot.
const tzWaiting = {};
function ensureTz(p) {
  if (p.tz) return Promise.resolve(p.tz);
  return tzWaiting[p.id] ??= relay(`/tz?lat=${p.lat}&lon=${p.lon}`)
    .then(d => { p.tz = d.tz; save(); return d.tz; })
    .catch(() => { delete tzWaiting[p.id]; return undefined; });
}

function buildNav() {
  const spots = visibleSpots();
  $("places").innerHTML = spots.map(p =>
    `<button aria-pressed="false" data-id="${p.id}">${esc(p.name)}<span class="badge"></span></button>`).join("");
  spots.forEach(p => Promise.all([getForecast(p), getWaves(p), ensureTz(p)]).then(([data, waves]) => badge(p, data, waves)).catch(() => {}));
  // (Surf badges appear once the waves have arrived.)
}
$("places").onclick = e => { const b = e.target.closest("button"); if (b) show(b.dataset.id); };

let current = null;
async function show(id) {
  const spots = visibleSpots();
  const p = spots.find(s => s.id === id) ?? spots[0];
  if (!p) {
    $("name").textContent = "Ingen spotter";
    $("sub").textContent = $("rule").textContent = $("live").textContent = "";
    $("list").innerHTML = `<p class="sub">Legg til en spot under ⚙︎.</p>`;
    return;
  }
  current = p.id;
  try { localStorage.setItem("place", p.id); } catch {}
  document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-pressed", b.dataset.id === p.id));
  $("name").textContent = p.name;
  $("sub").textContent = "";
  $("rule").textContent = "";
  $("live").textContent = "";
  $("list").innerHTML = `<p class="sub">Laster…</p>`;
  showLive(p);
  try {
    const [data] = await Promise.all([getForecast(p), ensureTz(p)]);
    if (current !== p.id) return; // the user already tapped another place
    render(p, data, p.surf ? undefined : null); // undefined = waves still loading
    // Waves can take a few seconds (NOAA's server is slow), so they're filled in when they arrive.
    if (p.surf) getWaves(p).then(waves => { if (current === p.id) render(p, data, waves); });
  } catch (err) {
    $("list").innerHTML = `<p class="error">Kunne ikke hente varselet: ${err.message}</p>`;
  }
}

// ---- 7. Live wind right now, from the nearest weather station ----------------
// The browser isn't allowed to ask MET's observation API (Frost) directly, so it asks our own
// small relay on Cloudflare (see relay/ in the repo), which asks Frost straight away.
const RELAY = "https://wingfoil-relay.wingfoil-relay.workers.dev";
const relay = path => fetch(RELAY + path).then(res => res.ok ? res.json() : Promise.reject(new Error(res.status)));

// Which station a spot uses: one chosen in settings, the default for that spot, or null = nearest.
const stationOf = p => p.station !== undefined ? p.station : DEFAULT_SPOTS.find(d => d.id === p.id)?.station ?? null;

const nearCache = {}; // stations near each spot, kept while the page is open: { stations: [MET…], holfuy: [Holfuy…] }
const nearby = p => nearCache[p.id] ??= relay(`/near?lat=${p.lat}&lon=${p.lon}`)
  .then(d => ({ stations: d.stations ?? [], holfuy: d.holfuy ?? [] }))
  .catch(e => { delete nearCache[p.id]; throw e; });

async function liveReading(p) {
  const chosen = stationOf(p);
  if (!chosen) return (await nearby(p)).stations[0] ?? null; // nearest MET station that measures wind
  const [r] = (await relay(`/obs?ids=${chosen.id}`)).stations;
  return r ? { ...r, name: chosen.name, km: chosen.km } : null;
}

function liveText(s) {
  const mins = Math.round((Date.now() - new Date(s.time)) / 60000);
  const ago = mins < 2 ? "akkurat nå" : mins < 90 ? `${mins} min siden` : `${Math.round(mins / 60)} t siden`;
  const dir = s.dir != null ? `${arrow(s.dir)}${compass(s.dir)}` : "";
  return `<b>Nå:</b> ${w(s.wind)} (${s.gust != null ? w(s.gust) : "–"}) ${unit()} ${dir}
    <small>· ${esc(s.name)}${s.km != null ? `, ${s.km} km` : ""} · ${ago}</small>`;
}

// Holfuy's official embeddable widget, which anyone may put on a page.
const holfuyWidget = id => `<iframe class="holfuy" title="Holfuy ${id}" loading="lazy"
  src="https://widget.holfuy.com/?station=${id}&su=${settings.units === "kn" ? "knots" : "m/s"}&t=C&lang=en&mode=detailed"></iframe>`;

async function showLive(p) {
  let chosen = stationOf(p);
  if (!chosen) {
    // "Nærmeste automatisk": a MET station if there is one within 50 km, otherwise the nearest Holfuy station.
    const near = await nearby(p).catch(() => null);
    if (current !== p.id) return;
    if (near && !near.stations.length && near.holfuy.length) chosen = near.holfuy[0];
  }
  if (chosen?.holfuy) {
    // Holfuy's widget is big and busy, so it stays folded away until someone taps "Se vind nå".
    $("live").classList.remove("good");
    $("live").innerHTML = `<details><summary><b>Se vind nå</b> <small>· ${esc(chosen.name || "Holfuy " + chosen.holfuy)}</small></summary>
      ${holfuyWidget(chosen.holfuy)}</details>`;
    return;
  }
  try {
    const s = await liveReading(p);
    if (current !== p.id) return;
    if (!s) { $("live").innerHTML = `<small>Ingen målestasjon funnet innen 50 km.</small>`; return; }
    $("live").innerHTML = liveText(s);
    // Green when it's blowing right now in a direction and strength that works here.
    const r = p.wind;
    const good = r && s.dir != null && r.dirs.includes(compass(s.dir)) && R.strong(s, r, settings.units);
    $("live").classList.toggle("good", !!good);
  } catch {
    if (current === p.id) $("live").innerHTML = `<small>Fikk ikke hentet målinger akkurat nå.</small>`;
  }
}

// ---- 8. Settings ---------------------------------------------------------------
// One full-screen sheet with three views: the spot list, editing a spot, and adding a spot.
// Every change is saved straight away; "Ferdig" just closes the sheet.
let view = { name: "list" };
const sheet = $("sheet");

function openSettings() { view = { name: "list" }; shownView = ""; renderSettings(); $("settings").hidden = false; }
function closeSettings() {
  $("settings").hidden = true;
  buildNav();
  show(current);
}
$("cog").onclick = openSettings;

let shownView = "";
function renderSettings() {
  const key = view.name + (view.i ?? "");
  if (key !== shownView) { $("settings").scrollTop = 0; shownView = key; }
  if (view.name === "list") sheet.innerHTML = listView();
  if (view.name === "edit") { sheet.innerHTML = editView(settings.spots[view.i]); stationChoices(settings.spots[view.i]); }
  if (view.name === "add")  { sheet.innerHTML = addView(); initMap(); }
}

function summary(p) {
  if (p.powder) return `Pudder · over ${p.powder.mm} mm, under +${p.powder.maxTemp}°`;
  if (p.surf) return `Surf · ${wvText(p.surf.minWave)} ${waveUnit()}+${p.surf.minPeriod ? ` ${p.surf.minPeriod} s+` : ""} · ` +
    `vind ≤ ${w(p.surf.maxWind)} ${unit()} fra ${dirSummary(p.surf.dirs)}`;
  return `${dirSummary(p.wind.dirs)} · ${limits(p.wind)} ${unit()}`;
}

function listView() {
  const n = settings.spots.length;
  return `
    <div class="sh"><span></span><h2>Innstillinger</h2><button class="link" data-act="close">Ferdig</button></div>
    <div class="lbl">Vindenhet</div>
    <div class="seg">
      <button data-act="units" data-v="ms" aria-pressed="${settings.units !== "kn"}">m/s</button>
      <button data-act="units" data-v="kn" aria-pressed="${settings.units === "kn"}">knop</button>
    </div>
    <div class="lbl">Bølgehøyde</div>
    <div class="seg">
      <button data-act="waveunit" data-v="m" aria-pressed="${waveUnit() === "m"}">meter</button>
      <button data-act="waveunit" data-v="ft" aria-pressed="${waveUnit() === "ft"}">fot</button>
    </div>
    <div class="lbl">Mine spotter · trykk for å endre, bryteren skjuler/viser</div>
    <ul class="spots">${settings.spots.map((p, i) => `
      <li>
        <div class="move">
          <button data-act="up" data-i="${i}" aria-label="Flytt opp" ${i === 0 ? "disabled" : ""}>▲</button>
          <button data-act="down" data-i="${i}" aria-label="Flytt ned" ${i === n - 1 ? "disabled" : ""}>▼</button>
        </div>
        <button class="spot" data-act="edit" data-i="${i}"><b>${esc(p.name)}</b><small>${summary(p)}</small></button>
        <label class="tg" aria-label="Vis ${esc(p.name)}"><input type="checkbox" data-act="visible" data-i="${i}" ${p.hidden ? "" : "checked"}><span></span></label>
      </li>`).join("")}
    </ul>
    <button class="wide" data-act="add">+ Legg til spot</button>
    <button class="wide danger" data-act="reset">Tilbakestill til standardspotter</button>`;
}

// A row with − / + buttons. kind "wind" shows and steps in the chosen unit; "wave" steps by 0.1 m;
// "num" is a plain number.
function stepper(label, p, path, kind = "num") {
  const v = path.split(".").reduce((o, k) => o[k], p) ?? 0;
  const shown = kind === "wind" ? w(v) : kind === "wave" ? wvText(v) : kind === "period" ? (v ? v : "av") : v;
  return `<div class="stepper"><span>${label}</span><span class="num">
    <button data-act="step" data-path="${path}" data-kind="${kind}" data-d="-1" aria-label="Mindre">−</button>
    <b>${shown}</b>
    <button data-act="step" data-path="${path}" data-kind="${kind}" data-d="1" aria-label="Mer">+</button>
  </span></div>`;
}

function toggle(label, act, on) {
  return `<label class="switch"><span>${label}</span>
    <span class="tg"><input type="checkbox" data-act="${act}" ${on ? "checked" : ""}><span></span></span></label>`;
}

// The direction picker: 16 wedges you tap to switch on (green) or off.
function compassPicker(dirs) {
  const cx = 105, cy = 105, R = 82, r = 34;
  const pt = (a, rad) => `${(cx + rad * Math.sin(a)).toFixed(1)} ${(cy - rad * Math.cos(a)).toFixed(1)}`;
  let svg = "";
  COMPASS.forEach((d, i) => {
    const a0 = (i - 0.5) * Math.PI / 8, a1 = (i + 0.5) * Math.PI / 8;
    const fill = dirs.includes(d) ? "var(--good)" : "var(--off)";
    svg += `<path data-act="dir" data-d="${d}" fill="${fill}"
      d="M${pt(a0, R)} A${R} ${R} 0 0 1 ${pt(a1, R)} L${pt(a1, r)} A${r} ${r} 0 0 0 ${pt(a0, r)} Z"><title>${d}</title></path>`;
    if (i % 4 === 0) {
      const [x, y] = pt(i * Math.PI / 8, R + 12).split(" ");
      svg += `<text x="${x}" y="${+y + 4}" text-anchor="middle">${d}</text>`;
    }
  });
  svg += `<text x="${cx}" y="${cy + 4}" text-anchor="middle">fra</text>`;
  return `<svg class="compass" viewBox="0 0 210 210" role="group" aria-label="Retninger">${svg}</svg>`;
}

// The stations near a spot, to pick from. "Nærmeste" means: always use whichever is nearest.
async function stationChoices(p) {
  const box = $("stations");
  try {
    const { stations: list, holfuy } = await nearby(p);
    if ($("stations") !== box) return; // the view changed meanwhile
    view.stations = list;
    view.holfuy = holfuy;
    const chosen = stationOf(p)?.id ?? "";
    const reading = s => `${w(s.wind)} (${s.gust != null ? w(s.gust) : "–"}) ${s.dir != null ? compass(s.dir) : ""}`;
    box.innerHTML = `<button data-act="station" data-id="" aria-pressed="${!stationOf(p)}">Nærmeste automatisk</button>` +
      list.map(s => `<button data-act="station" data-id="${s.id}" aria-pressed="${s.id === chosen}">
        <span>${esc(s.name)}</span><small>${s.km} km · nå ${reading(s)}</small></button>`).join("") +
      (list.length ? "" : `<p class="sub">Ingen MET-stasjoner med ferske vindmålinger innen 50 km. MET dekker mest Norge.</p>`) +
      (holfuy.length ? `<div class="lbl">Holfuy-stasjoner (viser Holfuys egen widget)</div>` +
        holfuy.map(h => `<button data-act="station" data-holfuy="${h.holfuy}" aria-pressed="${h.holfuy === stationOf(p)?.holfuy}">
          <span>${esc(h.name)}</span><small>${h.km} km · ${esc(h.type ?? "")}</small></button>`).join("") : "");
  } catch {
    box.innerHTML = `<p class="error">Fikk ikke hentet stasjoner akkurat nå.</p>`;
  }
}

function editView(p) {
  let rules = "";
  if (p.wind) {
    rules = `
      <div class="lbl">Retninger som funker · trykk for å velge</div>
      ${compassPicker(p.wind.dirs)}
      <div class="sub center">${dirSummary(p.wind.dirs)}</div>
      <div class="lbl">Bra vind (${unit()})</div>
      ${stepper("Middelvind minst", p, "wind.min", "wind")}
      ${stepper("… med kast minst", p, "wind.gust", "wind")}
      ${stepper("… eller jevn vind minst", p, "wind.steady", "wind")}
      ${stepper("Timer på rad", p, "wind.hours")}
      ${toggle("Bare i dagslys", "daylight", p.wind.daylight)}
      ${toggle("Egen grense på soldager", "sunny", !!p.wind.sunny)}
      ${p.wind.sunny ? `
        ${stepper("Soldager: middelvind minst", p, "wind.sunny.min", "wind")}
        ${stepper("… med kast minst", p, "wind.sunny.gust", "wind")}
        ${stepper("… eller jevn vind minst", p, "wind.sunny.steady", "wind")}` : ""}`;
  }
  if (p.surf) {
    rules = `
      <div class="lbl">Vindretninger som funker (f.eks. fralandsvind) · trykk for å velge</div>
      ${compassPicker(p.surf.dirs)}
      <div class="sub center">${dirSummary(p.surf.dirs)}</div>
      <div class="lbl">Bra surf</div>
      ${stepper(`Bølgehøyde minst (${waveUnit()})`, p, "surf.minWave", "wave")}
      ${stepper("Periode minst (s)", p, "surf.minPeriod", "period")}
      ${stepper(`Vind høyst (${unit()})`, p, "surf.maxWind", "wind")}
      ${stepper("Timer på rad", p, "surf.hours")}
      ${toggle("Bare i dagslys", "daylight", p.surf.daylight)}`;
  }
  if (p.powder) {
    rules = `
      <div class="lbl">Pudder</div>
      ${stepper("Nedbør på en dag over (mm)", p, "powder.mm")}
      ${stepper("Kaldere enn (°C)", p, "powder.maxTemp")}
      ${stepper(`Vind under (${unit()})`, p, "powder.maxWind", "wind")}`;
  }
  return `
    <div class="sh"><button class="link" data-act="back">‹ Spotter</button><h2 id="edit-title">${esc(p.name)}</h2><span></span></div>
    <div class="lbl">Navn</div>
    <input class="txt" data-act="name" value="${esc(p.name)}" maxlength="40">
    ${rules}
    <div class="lbl">Målestasjon for «Nå»-linjen</div>
    <div class="stations" id="stations"><p class="sub">Henter stasjoner i nærheten…</p></div>
    <button class="wide danger" data-act="delete">Slett spot</button>`;
}

function addView() {
  return `
    <div class="sh"><button class="link" data-act="back">‹ Spotter</button><h2>Legg til spot</h2><span></span></div>
    <form class="search" data-act="search">
      <input class="txt" name="q" placeholder="Søk etter sted" autocomplete="off">
      <button>Søk</button>
    </form>
    <div class="results" id="results"></div>
    <div class="lbl">… eller trykk på kartet der du vil ha spotten</div>
    <div id="map"></div>
    <button class="link" data-act="locate">Bruk min posisjon</button>
    <div id="pick" hidden>
      <div class="lbl">Navn på spotten</div>
      <input class="txt" id="newname" maxlength="40" placeholder="F.eks. Min hjemmespot">
      <div class="sub" id="pickpos"></div>
      <div class="error" id="pickerr"></div>
      <button class="wide primary" data-act="create" data-sport="wind">Legg til som wing-spot</button>
      <button class="wide primary" data-act="create" data-sport="surf">Legg til som surf-spot</button>
      <button class="wide primary" data-act="create" data-sport="powder">Legg til som pudder-spot</button>
    </div>`;
}

// The map comes from Leaflet, loaded only the first time someone opens "Legg til spot".
let leaflet, map, marker, pick = null;
function loadLeaflet() {
  return leaflet ??= new Promise((resolve, reject) => {
    const css = Object.assign(document.createElement("link"), { rel: "stylesheet",
      href: "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" });
    const js = Object.assign(document.createElement("script"), {
      src: "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js",
      onload: () => resolve(window.L), onerror: reject });
    document.head.append(css, js);
  });
}

async function initMap() {
  pick = null;
  const L = await loadLeaflet().catch(() => null);
  if (!L || !$("map")) return;
  const here = settings.spots.find(s => s.id === current) ?? { lat: 59.5, lon: 10.7 };
  map = L.map("map").setView([here.lat, here.lon], 9);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    { maxZoom: 18, attribution: "© OpenStreetMap" }).addTo(map);
  marker = null;
  map.on("click", e => setPick(e.latlng.lat, e.latlng.lng, ""));
}

function setPick(lat, lon, name) {
  pick = { lat: +lat.toFixed(4), lon: +lon.toFixed(4) };
  if (map) {
    const L = window.L;
    marker ? marker.setLatLng([lat, lon]) : (marker = L.marker([lat, lon]).addTo(map));
    map.setView([lat, lon], Math.max(map.getZoom(), 12));
  }
  $("pick").hidden = false;
  $("pickpos").textContent = `Posisjon ${pick.lat}, ${pick.lon}`;
  $("pickerr").textContent = "";
  if (name) $("newname").value = name;
  $("newname").focus();
}

async function search(q) {
  const out = $("results");
  out.innerHTML = `<p class="sub">Søker…</p>`;
  try {
    // OpenStreetMap's free place search. Their rules: at most one search per second, so we only search on "Søk".
    const url = "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=nb&q=" + encodeURIComponent(q);
    const places = await (await fetch(url)).json();
    view.results = places;
    out.innerHTML = places.length ? places.map((r, i) =>
      `<button data-act="result" data-i="${i}">${esc(r.name || r.display_name.split(",")[0])}
        <small>${esc(r.display_name)}</small></button>`).join("")
      : `<p class="sub">Fant ingenting. Prøv et annet navn, eller trykk på kartet.</p>`;
  } catch {
    out.innerHTML = `<p class="error">Søket feilet. Prøv igjen, eller trykk på kartet.</p>`;
  }
}

// All buttons in the settings sheet are handled here, by their data-act.
sheet.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.tagName === "INPUT" || el.tagName === "FORM") return;
  const act = el.dataset.act, i = Number(el.dataset.i);
  const spots = settings.spots;
  const p = view.name === "edit" ? spots[view.i] : null;

  if (act === "close") return closeSettings();
  if (act === "back") view = { name: "list" };
  if (act === "units") { settings.units = el.dataset.v; save(); }
  if (act === "waveunit") { settings.waveUnit = el.dataset.v; save(); }
  if (act === "up" || act === "down") {
    const j = act === "up" ? i - 1 : i + 1;
    [spots[i], spots[j]] = [spots[j], spots[i]];
    save();
  }
  if (act === "edit") view = { name: "edit", i };
  if (act === "add") view = { name: "add" };
  if (act === "reset" && confirm("Erstatte alle spottene dine med standardspottene?")) {
    settings.spots = structuredClone(DEFAULT_SPOTS);
    save();
  }
  if (act === "dir") {
    const rule = p.wind ?? p.surf, dirs = rule.dirs, d = el.dataset.d;
    rule.dirs = dirs.includes(d) ? dirs.filter(x => x !== d) : COMPASS.filter(x => x === d || dirs.includes(x));
    save();
  }
  if (act === "step") {
    const keys = el.dataset.path.split("."), last = keys.pop();
    const obj = keys.reduce((o, k) => o[k], p);
    obj[last] ??= 0; // e.g. minPeriod on spots saved before it existed
    const d = Number(el.dataset.d);
    let v = el.dataset.kind === "wind" ? fromUnit(w(obj[last]) + d)
          : el.dataset.kind === "wave" ? (waveUnit() === "ft" ? (wv(obj[last]) + d) / FEET : Math.round((obj[last] + d / 10) * 10) / 10)
          : obj[last] + d;
    if (last === "hours") v = Math.min(6, Math.max(1, v));
    else if (last !== "maxTemp") v = Math.max(0, v);
    obj[last] = v;
    save();
  }
  if (act === "station") {
    if (el.dataset.holfuy) {
      const h = view.holfuy.find(x => x.holfuy === Number(el.dataset.holfuy));
      p.station = { holfuy: h.holfuy, name: h.name, km: h.km };
    } else {
      const s = view.stations.find(x => x.id === el.dataset.id);
      p.station = s ? { id: s.id, name: s.name, km: s.km } : null;
    }
    save();
    // Only move the checkmark; redrawing the whole view would make the screen jump.
    document.querySelectorAll('#stations [data-act="station"]').forEach(b => b.setAttribute("aria-pressed", b === el));
    return;
  }
  if (act === "delete" && confirm(`Slette ${p.name}?`)) {
    spots.splice(view.i, 1);
    save();
    view = { name: "list" };
  }
  if (act === "locate") {
    navigator.geolocation.getCurrentPosition(
      pos => setPick(pos.coords.latitude, pos.coords.longitude, ""),
      err => { $("pick").hidden = false; $("pickerr").textContent = "Fikk ikke tak i posisjonen: " + err.message; });
    return;
  }
  if (act === "result") {
    const r = view.results[i];
    setPick(+r.lat, +r.lon, r.name || r.display_name.split(",")[0]);
    return;
  }
  if (act === "create") {
    const name = $("newname").value.trim();
    if (!pick) { $("pickerr").textContent = "Velg et sted først."; return; }
    if (!name) { $("pickerr").textContent = "Gi spotten et navn."; return; }
    const rule = el.dataset.sport === "surf" ? { surf: standardSurf() }
               : el.dataset.sport === "powder" ? { powder: standardPowder() }
               : { wind: standardWind() };
    spots.push({ id: "s" + Date.now(), name, lat: pick.lat, lon: pick.lon, ...rule });
    save();
    view = { name: "edit", i: spots.length - 1 }; // go straight on to picking directions
  }
  if (act === "search" || act === "result") return;
  renderSettings();
});

sheet.addEventListener("change", e => {
  const el = e.target, act = el.dataset.act;
  if (act === "visible") { settings.spots[Number(el.dataset.i)].hidden = !el.checked; save(); }
  const p = settings.spots[view.i];
  if (act === "daylight") { (p.wind ?? p.surf).daylight = el.checked; save(); }
  if (act === "sunny") {
    // Start the sunny-day limits one step below the normal ones (like Drøbak's 4 (8) / 5+).
    const r = p.wind;
    r.sunny = el.checked ? { min: Math.max(0, r.min - 1), gust: Math.max(0, r.gust - 1), steady: Math.max(0, r.steady - 1) } : null;
    save();
    renderSettings();
  }
});

sheet.addEventListener("input", e => {
  if (e.target.dataset.act !== "name") return;
  const p = settings.spots[view.i];
  p.name = e.target.value.trim() || p.name;
  $("edit-title").textContent = p.name;
  save();
});

sheet.addEventListener("submit", e => {
  e.preventDefault();
  const q = e.target.q.value.trim();
  if (q) search(q);
});

// For testing in the browser console: window.kookout.analyse(...), window.kookout.settings, …
window.kookout = { analyse, getForecast, getWaves, show, openSettings, closeSettings, buildNav, R,
                   get settings() { return settings; }, set settings(v) { settings = v; } };

// The "app is coming" note, until the visitor closes it. (When the app is out: link to the App Store here.)
try { $("appnote").hidden = localStorage.getItem("appnote-closed") === "1"; } catch { $("appnote").hidden = false; }
$("appnote-close").onclick = () => { $("appnote").hidden = true; try { localStorage.setItem("appnote-closed", "1"); } catch {} };

// ---- 9. Start: build the buttons and show the last-used spot ----------------
let start = null;
try { start = localStorage.getItem("place"); } catch {}
buildNav();
show(start);
</script>
</body>
</html>
