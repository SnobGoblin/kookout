# XcodeGen project description. Generate the Xcode project with:  cd ios && xcodegen
# (Kookout.xcodeproj is generated from this file, so it isn't kept in git.)
name: Kookout
options:
  bundleIdPrefix: com.sternell
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  # English is the base language, translated to Norwegian (Bokmål), Swedish, Danish, German, French and Spanish.
  knownRegions: [en, nb, sv, da, de, fr, es, Base]

targets:
  Kookout:
    type: application
    platform: iOS
    sources: [Kookout]
    # Push notifications (Apple's sandbox for builds from Xcode; the App Store build switches to production)
    entitlements:
      path: Kookout/Kookout.entitlements
      properties:
        aps-environment: development
        com.apple.developer.applesignin: [Default] # Sign in with Apple, for sharing and editing spots
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sternell.kookout
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "5"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1" # iPhone
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 5KZ7KF5NNH # the paid Apple Developer team (not the free Personal Team, which can't do push)
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon # Assets.xcassets, drawn by brand/render.swift
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor # sea blue #1C6EA4, buoy orange #FF6B2C in dark mode
        SWIFT_EMIT_LOC_STRINGS: YES # let Xcode find the app's texts for translation (Localizable.xcstrings)
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kookout
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.weather
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO # only HTTPS, so no export-compliance questions per upload
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Kookout uses your location to find spots near you and to show where you are on the map."
