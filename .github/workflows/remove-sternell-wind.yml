# One-off: deletes the old web address sternell.com/wind (Christian's decision, 10 Nov 2026).
# Run by hand once, then this file is removed again.
name: Remove sternell.com/wind

on:
  workflow_dispatch:

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SFTP
        run: |
          mkdir -p ~/.ssh
          echo "ftp.domeneshop.no ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBKMi4+UHxAA8poPV1eiusD2Yq3CJFxq/zZxIvaDM9OVM3fACBZ+1isJ6cBzd32szU2zdEeyJk3F/C6zR15rYuxA=" >> ~/.ssh/known_hosts
          sudo apt-get install -y -qq sshpass

      - name: Delete www/wind
        env:
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          # List first (for the log), then remove the files and the folder. "-": carry on if one is missing.
          printf -- 'ls -la www/wind\n-rm www/wind/*\n-rm www/wind/.htaccess\nrmdir www/wind\nls -la www\n' > batch.txt
          sshpass -e sftp -o BatchMode=no -b batch.txt sternell@ftp.domeneshop.no

      - name: Check
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://sternell.com/wind/)
          echo "sternell.com/wind/ now answers $code"
          test "$code" != 200
