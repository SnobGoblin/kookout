# Uploads the site to kookout.no every time something is pushed to main
# (FTP user "kookout", password in the secret KOOKOUT_FTP_PASSWORD; it lives only in GitHub's secrets).
# The old address sternell.com/wind was deleted on 10 Nov 2026.
name: Deploy Kookout

on:
  push:
    branches: [main]
    paths: [index.html, privacy.html, personvern.html, apple-touch-icon.png, 'img/**', 'img-1.1/**', .github/workflows/deploy.yml]
  workflow_dispatch: # adds a "Run workflow" button on GitHub, for deploying by hand

concurrency: deploy # never run two uploads at the same time

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Trust Domeneshop's server
        # Domeneshop's public host key (fingerprint SHA256:M2gRi/UErYL3/ZW8oumpdZ08qx/5Do9eH5iVHwCM7KA),
        # pinned so the upload refuses to talk to anything pretending to be them.
        run: |
          mkdir -p ~/.ssh
          echo "ftp.domeneshop.no ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBKMi4+UHxAA8poPV1eiusD2Yq3CJFxq/zZxIvaDM9OVM3fACBZ+1isJ6cBzd32szU2zdEeyJk3F/C6zR15rYuxA=" >> ~/.ssh/known_hosts
          sudo apt-get install -y -qq sshpass

      - name: Upload to kookout.no
        env:
          SSHPASS: ${{ secrets.KOOKOUT_FTP_PASSWORD }}
        run: |
          # kookout.no: the landing page and its images. The web version (forecast.html, rules.js) was taken down on
          # 11 Nov 2026; the "-rm" lines remove it from the server (fine if it's already gone).
          printf -- '-mkdir www/img\n-mkdir www/img-1.1\nput img/* www/img/\nput img-1.1/* www/img-1.1/\nput index.html www/index.html\nput privacy.html www/privacy.html\nput personvern.html www/personvern.html\nput apple-touch-icon.png www/apple-touch-icon.png\n-rm www/forecast.html\n-rm www/rules.js\n' > upload.txt
          sshpass -e sftp -o BatchMode=no -b upload.txt kookout@ftp.domeneshop.no

      - name: Check the live sites
        run: |
          curl -fsS https://kookout.no/ -o live.html
          cmp live.html index.html && echo "kookout.no matches this commit."
          curl -fsS https://kookout.no/privacy.html -o live-privacy.html
          cmp live-privacy.html privacy.html && echo "kookout.no/privacy.html matches this commit."
          code=$(curl -s -o /dev/null -w '%{http_code}' https://kookout.no/forecast.html)
          echo "kookout.no/forecast.html answers $code (should be 404)"
