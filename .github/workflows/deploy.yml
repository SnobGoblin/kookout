# Uploads the site to sternell.com/wind every time something is pushed to main.
# The FTP password lives in the repository secret FTP_PASSWORD, never in this file.
name: Deploy to sternell.com

on:
  push:
    branches: [main]
    paths: [index.html, apple-touch-icon.png]
  workflow_dispatch: # adds a "Run workflow" button on GitHub, for deploying by hand

concurrency: deploy # never run two uploads at the same time

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Trust Domeneshop's server
        # Domeneshop's public host key (fingerprint SHA256:M2gRi/UErYL3/ZW8oumpdZ08qx/5Do9eH5iVHwCM7KA),
        # pinned so the upload refuses to talk to anything pretending to be them.
        run: |
          mkdir -p ~/.ssh
          echo "ftp.domeneshop.no ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBKMi4+UHxAA8poPV1eiusD2Yq3CJFxq/zZxIvaDM9OVM3fACBZ+1isJ6cBzd32szU2zdEeyJk3F/C6zR15rYuxA=" >> ~/.ssh/known_hosts

      - name: Upload with SFTP
        env:
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y -qq sshpass
          printf 'put index.html www/wind/index.html\nput apple-touch-icon.png www/wind/apple-touch-icon.png\n' > upload.txt
          sshpass -e sftp -o BatchMode=no -b upload.txt sternell@ftp.domeneshop.no

      - name: Check the live site
        run: |
          curl -fsS https://sternell.com/wind/ -o live.html
          cmp live.html index.html && echo "Live site matches this commit."
