# Uploads the site to kookout.no every time something is pushed to main
# (FTP user "kookout", password in the secret KOOKOUT_FTP_PASSWORD; it lives only in GitHub's secrets).
# The old address sternell.com/wind was deleted on 10 Nov 2026.
name: Deploy Kookout

on:
  push:
    branches: [main]
    paths: [index.html, forecast.html, rules.js, privacy.html, personvern.html, apple-touch-icon.png, 'img/**', .github/workflows/deploy.yml]
  workflow_dispatch: # adds a "Run workflow" button on GitHub, for deploying by hand

concurrency: deploy # never run two uploads at the same time

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Trust Domeneshop's server
        # Domeneshop's public host key (fingerprint SHA256:M2gRi/UErYL3/ZW8oumpdZ08qx/5Do9eH5iVHwCM7KA),
        # pinned so the upload refuses to talk to anything pretending to be them.
        run: |
          mkdir -p ~/.ssh
          echo "ftp.domeneshop.no ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBKMi4+UHxAA8poPV1eiusD2Yq3CJFxq/zZxIvaDM9OVM3fACBZ+1isJ6cBzd32szU2zdEeyJk3F/C6zR15rYuxA=" >> ~/.ssh/known_hosts
          sudo apt-get install -y -qq sshpass

      - name: Upload to kookout.no
        env:
          SSHPASS: ${{ secrets.KOOKOUT_FTP_PASSWORD }}
        run: |
          # kookout.no: index.html is the landing page, forecast.html the web version. ("-mkdir": fine if it exists.)
          printf -- '-mkdir www/img\nput img/* www/img/\nput rules.js www/rules.js\nput forecast.html www/forecast.html\nput index.html www/index.html\nput privacy.html www/privacy.html\nput personvern.html www/personvern.html\nput apple-touch-icon.png www/apple-touch-icon.png\n' > upload.txt
          sshpass -e sftp -o BatchMode=no -b upload.txt kookout@ftp.domeneshop.no

      - name: Check the live sites
        run: |
          curl -fsS https://kookout.no/ -o live.html
          cmp live.html index.html && echo "kookout.no matches this commit."
          curl -fsS https://kookout.no/forecast.html -o live-forecast.html
          cmp live-forecast.html forecast.html && echo "kookout.no/forecast.html matches this commit."
          curl -fsS https://kookout.no/rules.js -o live-rules.js
          cmp live-rules.js rules.js && echo "kookout.no/rules.js matches this commit."
